name: Publish Morning Edition

on:
  schedule:
    # Allow time for research, rendering and Pages deployment before 8:30 AM.
    # Scheduled workflows may be delayed by GitHub and delivery is not guaranteed exact.
    - cron: '35 7 * * *'
      timezone: America/New_York
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/publish.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: morning-edition-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install generator dependencies
        if: github.event_name != 'push'
        run: pip install -r requirements.txt

      - name: Create today's edition
        if: github.event_name != 'push'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.4
        run: python scripts/build.py

      - name: Commit generated edition and history
        if: github.event_name != 'push'
        run: |
          git config user.name "morning-edition-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/ data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish Morning Edition $(TZ=America/New_York date +%Y-%m-%d)"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
